<html lang="en"><head><meta charset="utf-8"><title>MU Auction War Room</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>

</style></head><body>
<div class="top"><div><h1>MU Auction War Room</h1><small>You are MU’s VC · 24 players · 24 slots · nobody goes unsold</small></div>
<div class="ctl"><label>Base</label><input id="base" type="number" value="100"><label>Step</label><input id="step" type="number" value="10"><button id="undo">Undo last</button><button id="reset">Clear all</button><button id="bk">Backup</button><button id="rs">Restore</button></div></div>
<div class="sq" id="teams"></div>
<div class="main">
<div class="col"><div class="card" style="flex:1;overflow:auto;min-height:0"><div class="row"><h2>Player board · tap a player to put them on the block</h2><div class="leg"><span><i style="background:var(--g)"></i>Love</span><span><i style="background:var(--br)"></i>Backup</span><span><i style="background:var(--bl)"></i>Least</span><span><i style="background:var(--bd)"></i>No view</span></div></div><div class="bd" id="board"></div></div></div>
<div class="col"><div class="card" id="desk"></div><div class="card" id="plan"></div></div>
<div class="col"><div class="card" id="lab"></div><div class="card fl"><h2>Sales log</h2><div id="log" class="lg mut"></div></div></div>
</div>
<script>
const T=["MU","RK","SS","BB"],ME="MU",PUR=2000,N=6,WN=5;
const PRE={MU:["Kittu","Sreeram"],RK:["Srikanth Sir","Chandra"],SS:["Santhosh","Vysak"],BB:["LN","Yuvanesh"]};
// name,cat(A/B/W),pref,exp, stats[runs,avg,SR,eco,wkts,catches]
const P=[["MC","A","G",650,[211,21.1,170,9.3,2,8]],["Muthu","A","G",650,[128,25.6,160,7,3,2]],["Adithya","A","G",500],["Bala","A","G",650,[54,13.5,135,6.5,3,2]],["GP","A","G",400,[97,13.9,101,7.5,2,8]],["Dr Mani","A","G",400,[70,14,119,6.4,1,6]],["Amar","A","B",200],["Rajeev","A","G",200,[16,8,89,6.5,2,2]],
["Harish","B","L",100],["Ganesan","B","B",400,[152,21.7,173,9.2,3,6]],["Dhandapani","B","L",100],["Murali","B","N",100],["Venky","B","B",200],["BK","B","B",200],["Vibin","B","L",100,[42,5.3,84,9.5,3,2]],["RK","B","B",200,[40,20,267,7,3,1]],
["Prasana","W","G",200,[13,3.3,72,5.7,2,3]],["Rahul","W","L",150],["Naveen","W","N",100],["Aravinth","W","G",500],["Prashanth N","W","N",100,[40,5.7,105,8.1,2,6]],["Sabareesh","W","L",100],["Balaji Sir","W","B",200,[40,10,103,11.8,3,1]],["GaneshViku","W","N",100]];
const SL=[[600,["Muthu","Bala","MC"]],[500,["Aravinth","Adithya","Dr Mani"]],[400,["GP","Dr Mani","Ganesan"]],[200,["Rajeev","Prasana","Balaji Sir","Rahul"]],[200,["BK","Venky","RK","Amar"]],[100,["Vibin","Dhandapani","Harish","Sabareesh","Rahul"]]];
const inPlan=n=>SL.some(s=>s[1].includes(n));
const MUL={G:1.2,B:1.1,L:.85,N:.8},CN={A:"AR",B:"BAT",W:"BOWL"},$=id=>document.getElementById(id);
const by=n=>P.find(p=>p[0]===n);
const DEFCAP={MC:700},capOf=n=>(S.caps&&n in S.caps)?S.caps[n]:(DEFCAP[n]||0);
const PH=["A","W","B"],PHN={A:"All-rounders",W:"Bowlers",B:"Batsmen"},CT={A:"All-rounders",B:"Batsmen",W:"Bowlers"};
let S={log:[],block:null,base:100,step:10};
try{const x=JSON.parse(localStorage.getItem("mu_auc2")||"null");if(x)S=x}catch(e){}
const save=()=>{try{localStorage.setItem("mu_auc2",JSON.stringify(S))}catch(e){}};
const soldOf=n=>S.log.find(l=>l.n===n);
const r5=v=>Math.max(0,Math.floor(v/S.step)*S.step);
function ts(t,L=S.log){const k=L.filter(l=>l.t===t),pl=k.map(l=>by(l.n)),spent=k.reduce((a,l)=>a+l.p,0),purse=PUR-spent,left=N-k.length;
return{k,pl,spent,purse,left,max:left?Math.max(0,purse-S.base*(left-1)):0,ar:pl.filter(p=>p[1]=="A").length,bat:pl.filter(p=>p[1]=="B").length,bow:pl.filter(p=>p[1]=="W").length,talent:pl.reduce((a,p)=>a+p[3],0),val:k.reduce((a,l)=>a+by(l.n)[3]-l.p,0)}}
function slots(L=S.log){const m=ts(ME,L),f=SL.map(s=>({tier:s[0],ch:s[1],got:null}));
m.k.forEach(l=>{let c=f.filter(s=>!s.got&&s.ch.includes(l.n)).sort((a,b)=>b.tier-a.tier)[0]||f.filter(s=>!s.got).sort((a,b)=>a.tier-b.tier)[0];if(c)c.got=l});const d=f.filter(x=>x.got).reduce((a,x)=>a+x.got.p-x.tier,0),u=f.filter(x=>!x.got&&x.tier>S.base);f.forEach(x=>x.adj=x.tier);u.forEach(x=>x.adj=Math.max(S.base,Math.round((x.tier-d/u.length)/S.step)*S.step));return f}
function hypo(x){let L=S.log.slice(),u=[];(S.wi||[]).forEach(([n,pr])=>{if(!n||!(pr>0)||n===x||soldOf(n)||u.includes(n))return;L.push({n,t:ME,p:+pr});u.push(n)});return L}
function advise(p){const L=hypo(p[0]),m=ts(ME,L),f=slots(L).filter(s=>!s.got);if(!f.length)return{v:"FULL",c:0,cls:"no",why:"Your squad is full (counting your what-ifs)."};
let s=f.filter(x=>x.ch.includes(p[0])).sort((a,b)=>b.tier-a.tier)[0],plan=!!s;if(!s)s=f.sort((a,b)=>a.tier-b.tier)[0];
const rest=f.filter(x=>x!==s);let tg=(plan?p[3]*s.adj/s.tier:S.base)*MUL[p[2]];let why=[plan?`Fills your ${s.adj} slot${s.adj!=s.tier?` (was ${s.tier})`:""}`:"Off-plan player, capped low"];
const sc=m.purse-rest.reduce((a,x)=>a+Math.max(S.base,.6*x.adj),0),hm=m.purse-S.base*rest.length;
if(p[1]=="A"){if(m.ar<2){tg*=1.15;why.push(`Only ${m.ar}/2 ARs so far, +15%`)}else{tg*=.85;why.push("Already have 2 ARs, −15%")}}
let c=r5(Math.min(tg,Math.max(sc,S.base),hm));if(c<S.base)c=Math.min(S.base,hm);
if(c<tg)why.push(c==r5(hm)?"Capped by must-keep base for remaining slots":"Capped to protect budget for your other slots");
const cp=capOf(p[0]);if(cp>0&&c>cp){c=Math.max(S.base,cp);why.push("Your personal cap of "+cp)}
const th=T.filter(t=>t!=ME&&ts(t).max>=c&&ts(t).left>0).length;
const cls=p[2]=="G"||(p[2]=="B"&&c>=p[3]*.9)?"go":"mid";
return{v:c<=S.base&&p[2]!="G"?"PASS (or base only)":p[2]=="G"?"GO":p[2]=="B"?"BID IF FAIR":"VALUE ONLY",c,cls:c<=S.base&&p[2]!="G"?"no":cls,why:why.join(" · "),th}}
const stat=p=>{const s=p[4];return s?`${s[1]} avg · ${s[2]} SR · ${s[3]} eco · ${s[4]}w · ${s[5]}c`:"no stats"};
const rank=q=>"GBLN".indexOf(q[2])*100000-q[3];
function render(){
S.caps=S.caps||{};S.wi=(S.wi||[]).slice(0,WN);while(S.wi.length<WN)S.wi.push(["",0]);S.wi=S.wi.map(w=>w[0]&&soldOf(w[0])?["",0]:w);
if(S.block&&soldOf(S.block))S.block=null;
const ph=PH.find(c=>P.some(q=>q[1]==c&&!soldOf(q[0])));
$("base").value=S.base;$("step").value=S.step;
$("teams").innerHTML=T.map(t=>{const x=ts(t);return`<div class="team ${t==ME?"me":""}" title="C ${PRE[t][0]} · VC ${PRE[t][1]} · Strength ${x.talent} · Value ${x.val>=0?"+":""}${x.val}">
<div class="th"><b>${t}${t==ME?" (you)":""}</b><span class="pill">${x.left} to take</span><span class="pu">${x.purse}</span></div>
<div class="bar"><i style="width:${x.purse/PUR*100}%"></i></div>
<div class="tm"><span>max bid <b>${x.max}</b></span><span>avg/slot <b>${x.left?Math.round(x.purse/x.left):0}</b></span><span>AR ${x.ar} · BAT ${x.bat} · BOWL ${x.bow}</span></div>
<div class="ch">${x.k.map(l=>`<span class="chip ${by(l.n)[2]}">${l.n} ${l.p}</span>`).join("")||"<span class='mut sm'>no buys yet</span>"}</div></div>`}).join("");
const p=S.block?by(S.block):null;let d="<h2>Auction desk</h2>";
if(!p)S.bid=null;
if(!p)d+=ph?`<div class='big'>Now: ${PHN[ph]}</div><div class='mut'>Players are called randomly. Tap the player on the block. ${P.filter(q=>q[1]==ph&&!soldOf(q[0])).length} left in this round.</div>`:"<div class='big'>Auction complete</div>";else{const a=advise(p);if(!S.bid||S.bid.n!==p[0])S.bid={n:p[0],t:ME,auto:true};if(S.bid.auto)S.bid.p=a.c||S.base;
d+=`<div class="row"><div><div class="big">${p[0]}</div><span class="chip ${p[2]}">${CN[p[1]]}</span><span class="mut sm">my value ${p[3]} · ${stat(p)}</span></div><div style="text-align:right"><span class="verdict ${a.cls}">${a.v}</span><div class="big">≤ ${a.c}</div></div></div>
<div class="mut" style="margin:5px 0">${a.why}</div>${a.th!=null?`<div>${a.th?`<b>${a.th}</b> rival(s) can still bid above your ceiling.`:"No rival can afford to beat your ceiling."}</div>`:""}
<div class="mut sm" style="margin-top:3px">Ceiling already counts your what-if buys. The price below feeds the What-if lab live.</div><div class="mut sm" style="margin-top:3px">Rivals can bid up to: ${T.filter(t=>t!=ME).map(t=>`${t} ${ts(t).max}`).join(" · ")}</div>
<div class="row" style="margin-top:6px"><span>My cap <input id="cap" type="number" step="${S.step}" value="${capOf(p[0])||""}" placeholder="none" style="width:70px"></span>
<span><select id="bt">${T.map(t=>`<option ${t==S.bid.t?"selected":""}>${t}</option>`).join("")}</select> <input id="pr" type="number" step="${S.step}" min="${S.base}" placeholder="price" value="${S.bid.p}" style="width:74px"> <button class="p" id="sell">Sold</button></span></div>`;}
$("desk").innerHTML=d;
const f=slots(),m=ts(ME);
$("plan").innerHTML="<h2>Your 6-slot plan</h2><table>"+f.map(s=>`<tr><td style="width:46px"><b>${s.adj}</b>${s.adj!=s.tier?`<div class="mut" style="font-size:10.5px">was ${s.tier}</div>`:""}</td><td>${s.got?`<span class="chip G mine">${s.got.n} · paid ${s.got.p}</span> <span class="mut sm">${s.got.p<=s.tier?"saved "+(s.tier-s.got.p):"over by "+(s.got.p-s.tier)}</span>`:s.ch.map(n=>{const o=soldOf(n);return`<span class="chip ${by(n)[2]} ${o?"sold":""}">${n}${o?" → "+o.t:""}</span>`}).join("")}${!s.got&&s.ch.every(n=>soldOf(n))?`<div class="warn">All choices gone. Best left: ${P.filter(q=>!soldOf(q[0])).sort((a,b)=>rank(a)-rank(b)).slice(0,3).map(q=>q[0]).join(", ")}</div>`:""}</td></tr>`).join("")+`</table>
<div class="row sm" style="margin-top:5px"><b>ARs ${m.ar}/2 target</b><span class="mut">plan reserve ${f.filter(s=>!s.got).reduce((a,s)=>a+s.adj,0)} vs purse ${m.purse}</span></div>${m.ar<2&&P.filter(q=>q[1]=="A"&&!soldOf(q[0])).length<=2-m.ar+1?'<div class="warn">AR supply is running thin, you need 2.</div>':""}`;
$("board").innerHTML=PH.map(c=>`<div><h2>${CT[c]}</h2>${P.filter(q=>q[1]==c).sort((a,b)=>(!!soldOf(a[0])-!!soldOf(b[0]))||rank(a)-rank(b)).map(q=>{const o=soldOf(q[0]);return`<div class="pc ${q[2]} ${S.block==q[0]?"on":""} ${o?"done":""}" data-n="${q[0]}" tabindex="0"><div class="row"><span><b>${q[0]}</b>${inPlan(q[0])?'<span class="tag">plan</span>':""}</span><span>${o?`<span class="chip ${o.t==ME?"mine":""}">${o.t} ${o.p}</span>`:"~"+q[3]}</span></div><div class="mut sm">${stat(q)}</div></div>`}).join("")}</div>`).join("");
document.querySelectorAll(".pc").forEach(e=>{e.onclick=()=>{S.block=e.dataset.n;save();render()};e.onkeydown=ev=>{if(ev.key=="Enter")e.onclick()}});
$("log").innerHTML=S.log.length?S.log.map((l,i)=>S.ed===i?`${i+1}. ${l.n} <select id="et">${T.map(t=>`<option ${t==l.t?"selected":""}>${t}</option>`).join("")}</select> <input id="ep" type="number" value="${l.p}" step="${S.step}" style="width:70px"> <button class="p" id="es">Save</button> <button id="ec">Cancel</button>`:`${i+1}. ${l.n} → <b>${l.t}</b> ${l.p} <button data-e="${i}" title="Edit sale">Edit</button> <button data-d="${i}" title="Remove sale">Remove</button>`).reverse().join("<br>"):"Nothing sold yet.";
document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{S.ed=+b.dataset.e;render()});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("Remove this sale?")){S.log.splice(+b.dataset.d,1);S.ed=null;render()}});
if($("ec"))$("ec").onclick=()=>{S.ed=null;render()};
if($("es"))$("es").onclick=()=>{const c=S.log.map(x=>({...x}));c[S.ed].t=$("et").value;c[S.ed].p=+$("ep").value;
const ok=c.every(x=>x.p>=S.base)&&T.every(t=>{const k=c.filter(x=>x.t==t);return k.length<=N&&k.reduce((a,x)=>a+x.p,0)+S.base*(N-k.length)<=PUR});
if(!ok){alert("Not valid: price must be at least base, max 6 players per team, and each team must keep base × open slots.");return}S.log=c;S.ed=null;render()};
if($("cap"))$("cap").onchange=e=>{S.caps[S.block]=+e.target.value||0;render()};lab();if($("pr")){$("pr").oninput=e=>{S.bid.p=+e.target.value||0;S.bid.auto=false;lab()};$("bt").onchange=e=>{S.bid.t=e.target.value;lab()}}if($("sell"))$("sell").onclick=sell;if($("pr"))$("pr").onkeydown=e=>{if(e.key=="Enter")sell()};save()}
function lab(){
const bk=S.block&&!soldOf(S.block)?S.block:null,bd=S.bid&&bk&&S.bid.n===bk&&S.bid.t===ME&&S.bid.p>=S.base?S.bid.p:0;
const all=P.filter(q=>!soldOf(q[0])),un=all.filter(q=>q[0]!==bk).sort((a,b)=>rank(a)-rank(b)),live=T.filter(t=>ts(t).left>0),cash=live.reduce((a,t)=>a+ts(t).purse,0),val=all.reduce((a,q)=>a+q[3],0),idx=val?cash/val:1;
const lp=n=>Math.max(S.base,Math.round(by(n)[3]*idx/S.step)*S.step);
let L=hypo(bk);const used=L.slice(S.log.length).map(l=>l.n);if(bd){L.push({n:bk,t:ME,p:bd});used.push(bk)}
const m=ts(ME,L),sl=slots(L),open=sl.filter(x=>!x.got),hyp=L.slice(S.log.length),pv=hyp.reduce((a,l)=>a+by(l.n)[3]-l.p,0),mine=S.log.filter(l=>l.t===ME);
const sel=i=>`<div class="wi"><span class="mut">${i+1}</span><select data-wn="${i}"><option value="">none</option>${un.map(q=>`<option ${q[0]==S.wi[i][0]?"selected":""}>${q[0]} (${CN[q[1]]})</option>`).join("")}</select><input data-wp="${i}" type="number" step="${S.step}" placeholder="price" value="${S.wi[i][1]||""}"></div>`;
const rows=open.map(x=>{const av=x.ch.filter(n=>!soldOf(n)&&!used.includes(n)),top=av[0];return{x,top,t:top?lp(top):S.base,c:av.length?Math.min(...av.map(lp)):S.base}});
const dream=rows.reduce((a,r)=>a+r.t,0),floor=rows.reduce((a,r)=>a+r.c,0);
const bad=m.k.length>N||m.purse<S.base*Math.max(0,m.left)||hyp.some(l=>l.p<S.base);
const st=r=>r.t<=r.x.adj?"fits":r.t<=r.x.adj*1.25?"stretch":"over";
$("lab").innerHTML=`<h2>Impact lab · how each buy changes your next buys</h2>
<div class="row"><span class="sm"><b>Market pulse:</b> cash in room <b>${cash}</b> vs my values <b>${val}</b></span><span class="big">×${idx.toFixed(2)}</span></div>
<div class="mut sm" style="margin-bottom:6px">${idx>1.15?"More cash than talent: expect bidding wars.":idx<.9?"Room is cash-light: bargains likely.":"Roughly balanced."}</div>
<div class="sm" style="margin-bottom:4px"><b>Locked in:</b> ${mine.map(l=>`<span class="chip ${by(l.n)[2]} mine">${l.n} ${l.p}</span>`).join("")||"<span class='mut'>nothing bought yet</span>"}</div>
<b>What if I buy…</b> <span class="mut sm">(up to ${WN}, on top of real sales)</span><div style="margin:4px 0">${bk?`<div class="wi"><span class="mut">●</span><span><b>${bk}</b> <span class="mut sm">on the block${bd?", from desk":" · not counted (buyer not MU)"}</span></span><b>${bd||"–"}</b></div>`:""}${S.wi.map((_,i)=>sel(i)).join("")}<button id="wc">Clear what-ifs</button></div>
${bad?`<div class="warn">This path breaks a rule: needs at least ${S.base} per open slot, max ${N} players.</div>`:""}
<div class="row sm" style="margin:5px 0;flex-wrap:wrap"><span>Purse after <b>${m.purse}</b></span><span>Slots left <b>${m.left}</b></span><span>Avg/slot <b>${m.left>0?Math.round(m.purse/m.left):0}</b></span><span>ARs <b>${m.ar}</b>/2</span><span>Paid vs value <b>${hyp.length?(pv>=0?"+":"")+pv:"–"}</b></span></div>
<table><tr><th>Open slot</th><th>Best available</th><th>Likely</th><th>Fit</th></tr>${rows.map(r=>`<tr><td><b>${r.x.adj}</b>${r.x.adj!=r.x.tier?` <span class="mut sm">(was ${r.x.tier})</span>`:""}</td><td>${r.top?`<span class="chip ${by(r.top)[2]}">${r.top}</span>`:"all gone"}</td><td>${r.top?r.t:"–"}</td><td>${r.top?st(r):"over"}</td></tr>`).join("")}</table>
<div class="sm" style="margin-top:5px">Top choices <b>${dream}</b> · cheapest <b>${floor}</b> · purse <b>${m.purse}</b> → ${m.purse>=dream?"<b style='color:var(--g)'>comfortable</b>":m.purse>=floor?"<b style='color:var(--amb)'>doable if some slots drop to cheaper choices</b>":"<b style='color:var(--red)'>short by "+(floor-m.purse)+": expect base-price fills</b>"}</div>
<div class="mut sm" style="margin-top:3px">Likely = my value × market pulse. Overspend is spread over your open slots above base.</div>`;
document.querySelectorAll("[data-wn]").forEach(e=>e.onchange=()=>{const i=+e.dataset.wn,n=e.value.replace(/ \(.*\)$/,"");S.wi[i][0]=n;S.wi[i][1]=n?lp(n):0;render()});
document.querySelectorAll("[data-wp]").forEach(e=>e.onchange=()=>{S.wi[+e.dataset.wp][1]=+e.value||0;render()});
$("wc").onclick=()=>{S.wi=Array.from({length:WN},()=>["",0]);render()}}
function sell(){const p=+$("pr").value,t=$("bt").value,x=ts(t);if(!(p>=S.base)||x.left<1||p>x.max){alert(`${t} can bid at most ${x.max} (and ${x.left} slot(s) left). Base is ${S.base}.`);return}
S.log.push({n:S.block,t,p});S.block=null;render()}
$("undo").onclick=()=>{S.ed=null;const l=S.log.pop();if(l)S.block=l.n;render()};
$("reset").onclick=()=>{if(confirm("Clear the whole auction?")){S={log:[],block:null,base:100,step:10};render()}};
$("base").onchange=e=>{S.base=+e.target.value||100;render()};$("step").onchange=e=>{S.step=+e.target.value||10;render()};
$("bk").onclick=()=>{const j=JSON.stringify(S);try{navigator.clipboard.writeText(j).then(()=>alert("Backup copied to clipboard"),()=>prompt("Copy your backup:",j))}catch(e){prompt("Copy your backup:",j)}};
$("rs").onclick=()=>{const j=prompt("Paste backup");if(!j)return;try{const x=JSON.parse(j);if(!Array.isArray(x.log))throw 0;S=x;S.ed=null;render()}catch(e){alert("Invalid backup")}};
S.ed=null;render();
</script></body></html>
